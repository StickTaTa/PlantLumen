[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantlumen"
version = "0.1.2"
description = "Reference-assisted prediction of spatial expression from plant histology images"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
plantlumen = "plantlumen.cli:main"

[tool.setuptools]
packages = ["plantlumen"]
